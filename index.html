// ----- Thai timezone (Asia/Bangkok) date/time formatting -----
function bangkokYMD(date) {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
  const o = {};
  parts.forEach(p => { o[p.type] = p.value; });
  return Date.UTC(Number(o.year), Number(o.month) - 1, Number(o.day));
}

function fmtDateTime(dateStr) {
  const d = new Date(dateStr);
  const dateFmt = new Intl.DateTimeFormat('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric', month: 'short' });
  const timeFmt = new Intl.DateTimeFormat('th-TH', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  return `${dateFmt.format(d)} · ${timeFmt.format(d)} น.`;
}

// Four-tier countdown status computed against current Thai (Asia/Bangkok) time.
function dueBadge(dueDateStr) {
  const due = new Date(dueDateStr);
  const now = new Date();
  const diffDays = Math.round((bangkokYMD(due) - bangkokYMD(now)) / 86400000);

  if (due.getTime() < now.getTime()) {
    return { label: 'เลยกำหนดส่ง', cls: 'bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20', icon: 'alert-circle' };
  }
  if (diffDays <= 0) {
    return { label: 'ส่งวันนี้', cls: 'bg-orange-500/10 text-orange-600 dark:text-orange-400 border border-orange-500/20', icon: 'alarm-clock' };
  }
  if (diffDays === 1) {
    return { label: 'ส่งพรุ่งนี้', cls: 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20', icon: 'clock' };
  }
  return { label: `เหลืออีก ${diffDays} วัน`, cls: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20', icon: 'calendar' };
}

// ----- Client-side image compression --------------------------------------
// Draws the source image onto a canvas, resizes to a max dimension, and
// re-encodes as JPEG. Iteratively lowers quality (and, if still too large,
// dimensions) until the blob is under the target byte size.
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => resolve(img);
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function canvasToBlob(canvas, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('compress failed')), 'image/jpeg', quality);
  });
}
async function compressImage(file, { maxDim = 1200, quality = 0.75, maxBytes = 250 * 1024 } = {}) {
  const img = await loadImageFromFile(file);
  let dim = maxDim;
  for (let attempt = 0; attempt < 4; attempt++) {
    let { width, height } = img;
    if (width > dim || height > dim) {
      const scale = dim / Math.max(width, height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);

    let q = quality;
    let blob = await canvasToBlob(canvas, q);
    while (blob.size > maxBytes && q > 0.4) {
      q -= 0.1;
      blob = await canvasToBlob(canvas, q);
    }
    if (blob.size <= maxBytes || dim <= 500) return blob;
    dim = Math.round(dim * 0.75); // still too big — shrink dimensions and retry
  }
  // Fall through: return whatever the last attempt produced.
  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  canvas.getContext('2d').drawImage(img, 0, 0);
  return canvasToBlob(canvas, 0.6);
}

// Room-scoped uploads (homework images/documents) are filed under a per-classroom
// subfolder on the Drive side; shared uploads (teacher avatars, subject icons) pass
// an empty roomFolder so they land in a folder shared across every classroom.
function getRoomFolder() {
  return state.classroom ? `ม.${state.classroom.grade_level}-${state.classroom.room_number}` : '';
}

// Dual pipeline: images are compressed client-side before upload; documents
// (PDF/Word/PPTX/XLSX/ZIP) are sent as-is, capped at 15MB. category and roomFolder
// tell the Apps Script which subfolder to file the upload under. Returns the full
// Apps Script response so callers can save url/downloadUrl/fileName as needed.
async function uploadFileToGoogleDrive(file, { isImage = false, maxDim = 1200, quality = 0.75, maxBytes = 250 * 1024, category = '', roomFolder = '' } = {}) {
  if (!GOOGLE_DRIVE_SCRIPT_URL || GOOGLE_DRIVE_SCRIPT_URL.includes('YOUR_GOOGLE_APPS_SCRIPT')) {
    throw new Error('กรุณาตั้งค่า GOOGLE_DRIVE_SCRIPT_URL ก่อนอัปโหลดไฟล์');
  }
  let base64Data = '';
  let mimeType = file.type || 'application/octet-stream';
  let fileName = file.name || `file_${Date.now()}`;

  if (isImage && file.type.startsWith('image/')) {
    const blob = await compressImage(file, { maxDim, quality, maxBytes });
    base64Data = await fileToBase64(blob);
    mimeType = 'image/jpeg';
  } else {
    if (file.size > 15 * 1024 * 1024) throw new Error('ไฟล์มีขนาดเกิน 15 MB');
    base64Data = await fileToBase64(file);
  }

  let response;
  try {
    response = await fetch(GOOGLE_DRIVE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ base64Data, mimeType, fileName, category, roomFolder })
    });
  } catch (e) {
    throw new Error('เชื่อมต่อ Google Drive ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
  }
  let result;
  try {
    result = await response.json();
  } catch (e) {
    throw new Error('Google Drive ตอบกลับไม่ถูกต้อง');
  }
  if (!result.success || !result.url) {
    throw new Error(result.error || 'เกิดข้อผิดพลาดในการอัปโหลดไฟล์ไป Google Drive');
  }
  return result; // { url, downloadUrl, fileId, fileName, mimeType }
}

// folder ∈ 'teachers' | 'subjects' | 'assignments' — maps to the matching Drive
// category, and to a room subfolder for assignment images only (teacher/subject
// media is shared across classrooms so it stays in the shared folder).
const UPLOAD_CATEGORY = {
  teachers: 'รูปครูผู้สอน',
  subjects: 'ไอคอนวิชา',
  assignments: 'การบ้านและชีทเรียน',
};
const UPLOAD_IS_ROOM_SCOPED = { assignments: true };

async function uploadImage(file, folder, opts) {
  const category = UPLOAD_CATEGORY[folder] || '';
  const roomFolder = UPLOAD_IS_ROOM_SCOPED[folder] ? getRoomFolder() : '';
  const result = await uploadFileToGoogleDrive(file, { isImage: true, ...opts, category, roomFolder });
  return result.url;
}

function formatFileSize(bytes) {
  if (bytes === null || bytes === undefined || isNaN(bytes)) return '';
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function fileTypeMeta(fileName) {
  const ext = (fileName || '').split('.').pop().toLowerCase();
  if (ext === 'pdf') return { icon: 'file-text', label: 'PDF' };
  if (['doc', 'docx'].includes(ext)) return { icon: 'file-text', label: 'Word' };
  if (['ppt', 'pptx'].includes(ext)) return { icon: 'presentation', label: 'PowerPoint' };
  if (['xls', 'xlsx'].includes(ext)) return { icon: 'file-spreadsheet', label: 'Excel' };
  if (ext === 'zip' || ext === 'rar') return { icon: 'file-archive', label: 'ZIP' };
  return { icon: 'file', label: ext ? ext.toUpperCase() : 'ไฟล์' };
}

function icon(name, cls='w-4 h-4') {
  return `<i data-lucide="${name}" class="${cls}"></i>`;
}
function renderIcons() { if (window.lucide) lucide.createIcons(); }

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ---------- DATA LOADING ----------------------------------------------------
async function loadClassroomData() {
  if (!state.classroom) return;
  const sb = await ensureSupabase();
  if (!sb) { state.view = 'picker'; render(); return; }
  state.loading = true; render();
  try {
    const [{ data: subs, error: subErr }, { data: asns, error: asnErr }] = await Promise.all([
      sb.from('subjects').select('*').eq('classroom_id', state.classroom.id).order('subject_code'),
      sb.from('assignments').select('*').eq('classroom_id', state.classroom.id).order('due_date', { ascending: true }),
    ]);
    if (subErr || asnErr) { toast('โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง', 'error'); console.error(subErr, asnErr); }
    state.subjects = subs || [];
    state.assignments = asns || [];
  } catch (e) {
    console.error(e);
    toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
  } finally {
    state.loading = false;
    render();
  }
}

function ViewDashboard() {
  const c = state.classroom;
  const filtered = state.assignments.filter(a => {
    if (state.filter === 'pending' && state.doneIds.has(a.id)) return false;
    if (state.filter === 'done' && !state.doneIds.has(a.id)) return false;
    if (state.subjectFilter !== 'all' && a.subject_id !== state.subjectFilter) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      const subj = state.subjects.find(s => s.id === a.subject_id);
      const hay = `${a.title} ${a.description||''} ${subj?.subject_name||''} ${subj?.subject_code||''} ${subj?.teacher_name||''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const pendingCount = state.assignments.filter(a => !state.doneIds.has(a.id)).length;

  return `
  <div class="fade-in">
    <div class="sticky top-0 z-30 bg-slate-100/90 dark:bg-slate-950/90 backdrop-blur px-5 pt-5 pb-3">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400 dark:text-slate-500 font-medium">ห้องเรียน</div>
          <div class="text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-1.5">
            ${GRADE_TH[c.grade_level]}/${c.room_number}
            <button id="switch-room" class="text-xs text-brand-600 dark:text-brand-400 font-semibold underline underline-offset-2">เปลี่ยนห้อง</button>
          </div>
        </div>
        <div class="flex items-center gap-2">
          ${themeToggleBtn()}
          <button id="rep-mode-btn" class="h-9 px-3 rounded-xl ${state.repMode?'bg-brand-600 text-white':'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 shadow-card border border-slate-200 dark:border-slate-800'} flex items-center gap-1.5 text-xs font-bold shrink-0">
            ${icon('key-round','w-3.5 h-3.5')} ${state.repMode ? 'โหมดตัวแทนห้อง' : 'ตัวแทนห้อง'}
          </button>
        </div>
      </div>

      <div class="mt-3 relative">
        ${icon('search', 'w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2')}
        <input id="search-input" type="text" value="${esc(state.search)}" placeholder="ค้นหาการบ้าน วิชา หรือคำสั่งงาน..."
          class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 shadow-card border border-slate-200 dark:border-slate-800 text-sm outline-none focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900">
      </div>

      <div class="mt-3 flex gap-1.5 overflow-x-auto no-scrollbar">
        ${[['all','ทั้งหมด'],['pending',`ยังไม่เสร็จ${pendingCount?` (${pendingCount})`:''}`],['done','เสร็จแล้ว']].map(([k,l]) => `
          <button data-tab="${k}" class="tab-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold border ${state.filter===k?'bg-brand-600 text-white border-brand-600':'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800'}">${l}</button>
        `).join('')}
      </div>

      ${state.subjects.length ? `
      <div class="mt-2 flex gap-1.5 overflow-x-auto no-scrollbar">
        <button data-subj="all" class="subj-filter-btn shrink-0 px-3 py-1 rounded-full text-[11px] font-semibold border ${state.subjectFilter==='all'?'bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 border-slate-800 dark:border-slate-100':'bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-800'}">ทุกวิชา</button>
        ${state.subjects.map(s => {
          const col = colorForSubject(s.subject_code);
          const active = state.subjectFilter === s.id;
          return `<button data-subj="${s.id}" class="subj-filter-btn shrink-0 px-3 py-1 rounded-full text-[11px] font-semibold border ${active?'bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 border-slate-800 dark:border-slate-100':`${col.bg} ${col.text} border-transparent`}">${esc(s.subject_code)}</button>`;
        }).join('')}
      </div>` : ''}
    </div>

    <div class="px-5 pt-2 space-y-3">
      ${state.repMode ? `
      <button id="add-assignment-btn" class="w-full py-3 rounded-xl border-2 border-dashed border-brand-300 dark:border-brand-700 text-brand-600 dark:text-brand-400 font-bold text-sm flex items-center justify-center gap-1.5 bg-brand-50/50 dark:bg-brand-500/10">
        ${icon('plus','w-4 h-4')} เพิ่มการบ้านใหม่
      </button>
      <button id="manage-subjects-btn" class="w-full py-2.5 rounded-xl bg-white dark:bg-slate-900 shadow-card border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-sm flex items-center justify-center gap-1.5">
        ${icon('layout-list','w-4 h-4')} จัดการรายวิชา (${state.subjects.length})
      </button>` : ''}

      ${state.loading ? renderSkeletons() : (filtered.length ? filtered.map(renderCard).join('') : renderEmpty())}
    </div>
  </div>`;
}

function renderSkeletons() {
  return Array.from({length:3}).map(()=>`
    <div class="bg-white dark:bg-slate-900 rounded-xl2 shadow-card border border-slate-200 dark:border-slate-800 p-4">
      <div class="skeleton h-4 w-24 rounded-full mb-3"></div>
      <div class="skeleton h-5 w-3/4 rounded mb-2"></div>
      <div class="skeleton h-4 w-full rounded mb-1"></div>
      <div class="skeleton h-4 w-1/2 rounded"></div>
    </div>`).join('');
}

function renderEmpty() {
  const msgs = {
    all: ['sparkles', 'ยังไม่มีการบ้านในห้องนี้', 'พักได้เต็มที่ ยังไม่มีงานส่ง'],
    pending: ['party-popper', 'ทำครบทุกงานแล้ว!', 'เก่งมาก ไม่มีงานค้างส่งเลย'],
    done: ['inbox', 'ยังไม่มีงานที่ทำเสร็จ', 'ติ๊กงานที่ทำเสร็จแล้วเพื่อเก็บไว้ที่นี่'],
  };
  const [ic, title, sub] = msgs[state.filter] || msgs.all;
  return `
    <div class="text-center py-14 px-6">
      <div class="w-14 h-14 rounded-2xl bg-white dark:bg-slate-900 shadow-card border border-slate-200 dark:border-slate-800 mx-auto grid place-items-center text-brand-500 mb-3">${icon(ic,'w-7 h-7')}</div>
      <div class="font-bold text-slate-800 dark:text-slate-100">${title}</div>
      <div class="text-slate-400 dark:text-slate-500 text-sm mt-1">${sub}</div>
    </div>`;
}

function subjectAvatar(subj, col) {
  if (subj && subj.subject_icon_url) {
    return `<button data-preview="${esc(subj.subject_icon_url)}" class="w-8 h-8 rounded-lg overflow-hidden shrink-0 bg-slate-100 dark:bg-slate-800"><img src="${esc(subj.subject_icon_url)}" class="w-full h-full object-cover" loading="lazy"></button>`;
  }
  return `<div class="w-8 h-8 rounded-lg shrink-0 grid place-items-center font-bold text-[11px] ${col.bg} ${col.text}">${esc((subj?.subject_code||'?').slice(0,2))}</div>`;
}

function renderCard(a) {

  return `
  <div class="bg-white dark:bg-slate-900 rounded-xl2 shadow-card border border-slate-200 dark:border-slate-800 p-4 ${done ? 'opacity-60' : ''}" data-card="${a.id}">
    <div class="flex items-start justify-between gap-2">
      <div class="flex items-center gap-2 mb-2 min-w-0">
        ${subjectAvatar(subj, col)}
        <div class="flex flex-wrap items-center gap-1.5 min-w-0">
          <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${col.bg} ${col.text}">${esc(subj?.subject_code || 'ไม่ระบุวิชา')}</span>
          ${subj?.subject_name ? `<span class="text-[11px] text-slate-400 dark:text-slate-500 font-medium truncate">${esc(subj.subject_name)}</span>` : ''}
          <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${a.task_type==='GROUP' ? 'bg-fuchsia-50 dark:bg-fuchsia-500/10 text-fuchsia-700 dark:text-fuchsia-400' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${a.task_type==='GROUP' ? 'งานกลุ่ม' : 'งานเดี่ยว'}</span>
        </div>
      </div>
      ${state.repMode ? `
      <div class="flex gap-1 shrink-0">
        <button data-edit="${a.id}" class="w-7 h-7 rounded-lg bg-slate-50 dark:bg-slate-800 grid place-items-center text-slate-500 dark:text-slate-300">${icon('pencil','w-3.5 h-3.5')}</button>
        <button data-delete="${a.id}" class="w-7 h-7 rounded-lg bg-red-50 dark:bg-red-500/10 grid place-items-center text-red-500 dark:text-red-400">${icon('trash-2','w-3.5 h-3.5')}</button>
      </div>` : ''}
    </div>

    <div class="flex gap-3">
      <div class="flex-1 min-w-0">
        <h3 class="font-bold text-slate-900 dark:text-white leading-snug ${done?'line-through decoration-2':''}">${esc(a.title)}</h3>
        ${a.description ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${esc(a.description)}</p>` : ''}
        ${subj?.teacher_name ? `<div class="text-xs text-slate-400 dark:text-slate-500 mt-1.5 flex items-center gap-1">
          ${subj.teacher_image_url ? `<img src="${esc(subj.teacher_image_url)}" class="w-4 h-4 rounded-full object-cover">` : icon('user-round','w-3 h-3')}
          ${esc(subj.teacher_name)}
        </div>` : ''}
        ${a.file_url ? `
        <a href="${esc(a.file_url)}" target="_blank" rel="noopener" class="mt-2 inline-flex max-w-full items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300">
          ${icon(fileTypeMeta(a.file_name).icon,'w-3.5 h-3.5 shrink-0')}
          <span class="truncate">${esc(a.file_name || 'ไฟล์แนบ')}</span>
          ${a.file_size_label ? `<span class="text-slate-400 dark:text-slate-500 shrink-0">· ${esc(a.file_size_label)}</span>` : ''}
        </a>` : ''}
      </div>
      ${a.image_url ? `
      <button data-preview="${esc(a.image_url)}" class="relative shrink-0 w-16 h-16 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800">
        <img src="${esc(a.image_url)}" class="w-full h-full object-cover" loading="lazy">
        <span class="absolute bottom-1 right-1 bg-black/50 rounded-md p-0.5">${icon('zoom-in','w-3 h-3 text-white')}</span>
      </button>` : ''}
    </div>

    <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100 dark:border-slate-800">
      <div class="flex items-center gap-1.5 text-xs">
        <span class="px-2 py-1 rounded-lg font-semibold flex items-center gap-1 ${badge.cls}">${icon(badge.icon,'w-3 h-3')} ${badge.label}</span>
        <span class="text-slate-400 dark:text-slate-500 num">${fmtDateTime(a.due_date)}</span>
      </div>
      <button data-toggle-done="${a.id}" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold ${done ? 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400' : 'bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-300'}">
        ${icon(done?'check-circle-2':'circle', 'w-4 h-4')} ${done ? 'เสร็จแล้ว' : 'ทำเสร็จ'}
      </button>

}

// ---------- REP GATE / SUBJECT MANAGER / ASSIGNMENT FORM (modals) ----------

function modalShell(inner, { wide=false } = {}) {
  return `
  <div class="fixed inset-0 z-[250] bg-slate-900/40 dark:bg-black/60 flex items-end sm:items-center justify-center" id="modal-backdrop">
    <div class="rise-in bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-800 w-full ${wide?'sm:max-w-lg':'sm:max-w-md'} sm:rounded-xl2 rounded-t-xl2 max-h-[92vh] overflow-y-auto">
      ${inner}
    </div>
  </div>`;
}

const inputCls = 'w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 dark:focus:ring-brand-900 outline-none text-sm';
const labelCls = 'text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1 block';
const closeBtnCls = 'w-8 h-8 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 grid place-items-center';

function renderRepGate() {
  document.getElementById('modal-root').innerHTML = modalShell(`
    <div class="p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-extrabold text-lg text-slate-900 dark:text-white flex items-center gap-2">${icon('key-round','w-5 h-5 text-brand-600 dark:text-brand-400')} เข้าสู่โหมดตัวแทนห้อง</h3>
        <button id="modal-close" class="${closeBtnCls}">${icon('x','w-4 h-4')}</button>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">กรอกรหัสผ่านของห้อง ${GRADE_TH[state.classroom.grade_level]}/${state.classroom.room_number} เพื่อจัดการวิชาและการบ้าน</p>
      <input id="passcode-input" type="password" inputmode="numeric" maxlength="10" placeholder="รหัสผ่านห้อง" autofocus
        class="${inputCls} text-center tracking-widest font-bold num text-lg py-3">
      <div id="passcode-error" class="text-red-500 dark:text-red-400 text-xs text-center mt-2 hidden">รหัสผ่านไม่ถูกต้อง</div>
      <button id="passcode-submit" class="w-full mt-4 py-3 rounded-xl bg-brand-600 text-white font-bold text-sm">ปลดล็อก</button>
    </div>
  `);
  renderIcons();
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id==='modal-backdrop') closeModal(); });
  const input = document.getElementById('passcode-input');
  input.focus();
  const submitBtn = document.getElementById('passcode-submit');
  const submit = async () => {
    const val = input.value.trim();
    if (!val) return;
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true; submitBtn.textContent = 'กำลังตรวจสอบ...';
    try {
      const sb = await ensureSupabase();
      if (!sb) return;
      const { data, error } = await sb.rpc('verify_classroom_passcode', { p_classroom_id: state.classroom.id, p_passcode: val });
      if (error) { toast('เกิดข้อผิดพลาด ลองใหม่', 'error'); console.error(error); return; }
      if (data === true) {
        setRepUnlocked(state.classroom.id);
        state.repMode = true;
        closeModal();
        toast('เข้าสู่โหมดตัวแทนห้องแล้ว', 'success');
        render();
      } else {
        document.getElementById('passcode-error').classList.remove('hidden');
        input.classList.add('border-red-400');
      }
    } catch (e) {
      console.error(e);
      toast('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
    } finally {
      if (submitBtn.isConnected) { submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
    }
  };
  submitBtn.onclick = submit;
  input.addEventListener('keydown', e => { if (e.key==='Enter') submit(); });
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function renderSubjectManager() {
  document.getElementById('modal-root').innerHTML = modalShell(`
    <div class="p-5">
      <div class="flex items-center justify-between mb-1">
        <h3 class="font-extrabold text-lg text-slate-900 dark:text-white">จัดการรายวิชา</h3>
        <button id="modal-close" class="${closeBtnCls}">${icon('x','w-4 h-4')}</button>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">เพิ่มด้วยตนเอง หรือสแกนตารางเรียนด้วย AI</p>

      <div class="flex gap-2 mb-4">
        <button id="scan-timetable-btn" class="flex-1 py-2.5 rounded-xl bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 font-bold text-sm flex items-center justify-center gap-1.5">${icon('scan-line','w-4 h-4')} สแกนตารางเรียน</button>
        <button id="add-subject-btn" class="flex-1 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center gap-1.5">${icon('plus','w-4 h-4')} เพิ่มวิชาเอง</button>
      </div>

      <div id="subject-list" class="space-y-2">
        ${state.subjects.length ? state.subjects.map(s => {
          const col = colorForSubject(s.subject_code);
          return `
          <div class="flex items-center gap-2 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            ${subjectAvatar(s, col)}
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold text-slate-800 dark:text-slate-100 truncate">${esc(s.subject_name || s.subject_code || '-')}</div>
              <div class="text-xs text-slate-400 dark:text-slate-500 truncate flex items-center gap-1">
                ${s.teacher_image_url ? `<img src="${esc(s.teacher_image_url)}" class="w-3.5 h-3.5 rounded-full object-cover">` : ''}
                ${esc(s.teacher_name || 'ไม่ระบุครูผู้สอน')}
              </div>
            </div>
            <button data-edit-subject="${s.id}" class="w-7 h-7 rounded-lg bg-slate-50 dark:bg-slate-800 grid place-items-center text-slate-500 dark:text-slate-300 shrink-0">${icon('pencil','w-3.5 h-3.5')}</button>
            <button data-delete-subject="${s.id}" class="w-7 h-7 rounded-lg bg-red-50 dark:bg-red-500/10 grid place-items-center text-red-500 dark:text-red-400 shrink-0">${icon('trash-2','w-3.5 h-3.5')}</button>
          </div>`;
        }).join('') : `<div class="text-center text-sm text-slate-400 dark:text-slate-500 py-8">ยังไม่มีรายวิชา</div>`}
      </div>
    </div>
  `, { wide:true });
  renderIcons();
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id==='modal-backdrop') closeModal(); });
  document.getElementById('add-subject-btn').onclick = () => { state.editingSubject = null; renderSubjectForm(); };
  document.getElementById('scan-timetable-btn').onclick = renderOcrScanner;
  document.querySelectorAll('[data-preview]').forEach(b => b.onclick = () => renderImagePreviewModal(b.dataset.preview));
  document.querySelectorAll('[data-edit-subject]').forEach(b => b.onclick = () => {
    state.editingSubject = state.subjects.find(s => s.id === b.dataset.editSubject);
    renderSubjectForm();
  });
  document.querySelectorAll('[data-delete-subject]').forEach(b => b.onclick = async () => {
    const ok = await confirmDialog({ title:'ลบรายวิชา', message:'การบ้านที่ผูกกับวิชานี้จะกลายเป็น "ไม่ระบุวิชา" ต้องการลบหรือไม่?', confirmLabel:'ลบวิชา', danger:true });
    if (!ok) return;
    b.disabled = true;
    try {
      const sb = await ensureSupabase();
      if (!sb) return;
      const { error } = await sb.from('subjects').delete().eq('id', b.dataset.deleteSubject);
      if (error) { toast('ลบไม่สำเร็จ', 'error'); console.error(error); return; }
      toast('ลบรายวิชาแล้ว', 'success');
      await loadClassroomData();
      renderSubjectManager();
    } catch (e) {
      console.error(e);
      toast('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
    } finally {
      if (b.isConnected) b.disabled = false;
    }
  });
}

function renderOcrScanner() {
  const key = localStorage.getItem(LS.geminiKey) || '';
  document.getElementById('modal-root').innerHTML = modalShell(`
    <div class="p-5">
      <div class="flex items-center justify-between mb-1">
        <h3 class="font-extrabold text-lg text-slate-900 dark:text-white flex items-center gap-2">
          ${icon('scan-line','w-5 h-5 text-brand-600 dark:text-brand-400')} สแกนตารางเรียนด้วย AI
        </h3>
        <button id="modal-close" class="${closeBtnCls}">${icon('x','w-4 h-4')}</button>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">
        อัปโหลดรูปตารางเรียน ระบบจะคัดกรองเฉพาะรายวิชาที่ไม่ซ้ำกันให้อัตโนมัติ
      </p>

      <div class="mb-3">
        <label class="${labelCls}">Gemini API Key <span class="font-normal text-slate-400 dark:text-slate-500">(บันทึกในเครื่องนี้เท่านั้น)</span></label>
        <input id="gemini-key" type="password" value="${esc(key)}" placeholder="AIza..." class="${inputCls} num">
      </div>

      <div id="ocr-drop" class="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl2 p-6 text-center cursor-pointer hover:border-brand-500 dark:hover:border-brand-500 transition">
        <input id="ocr-file" type="file" accept="image/*" capture="environment" class="hidden">
        <div id="ocr-drop-content">
          ${icon('image-plus','w-8 h-8 text-slate-300 dark:text-slate-600 mx-auto mb-2')}
          <div class="text-sm font-semibold text-slate-700 dark:text-slate-200">แตะเพื่อเลือกรูปตารางเรียน</div>
          <div class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">รองรับ JPG, PNG</div>
        </div>
      </div>

      <div id="ocr-result" class="mt-4"></div>
    </div>
  `, { wide: true });
  renderIcons();

  document.getElementById('modal-close').onclick = () => renderSubjectManager();
  document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') renderSubjectManager(); });

  const fileInput = document.getElementById('ocr-file');
  document.getElementById('ocr-drop').onclick = () => fileInput.click();

  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const apiKey = document.getElementById('gemini-key').value.trim();
    if (!apiKey) { toast('กรุณากรอก Gemini API Key ก่อน', 'error'); return; }
    localStorage.setItem(LS.geminiKey, apiKey);

    const resultEl = document.getElementById('ocr-result');
    resultEl.innerHTML = `
      <div class="flex items-center justify-center gap-2 text-sm text-slate-500 dark:text-slate-400 py-6">
        <div class="w-5 h-5 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
        <span id="ocr-status-text">กำลังประมวลผลรูปภาพและตัดวิชาซ้ำ...</span>
      </div>`;

    // ใช้ 2 โมเดล: 3.7 Flash เป็นหลัก และ 3.5 Flash-Lite เป็นตัวสำรอง
    const MODELS = [
      'gemini-3.7-flash',
      'gemini-3.5-flash-lite'
    ];

    try {
      const compressedBlob = await compressImage(file, { maxDim: 1400, quality: 0.75 });
      const base64 = await fileToBase64(compressedBlob);

      const prompt = `You are an expert OCR parser for Thai secondary school weekly timetables (ตารางเรียน ม.1 - ม.6).
Extract all unique academic subject-teacher pairs taught during the week.

Rules:
1. Deduplication Rule: A course slot is only considered a duplicate if BOTH 'subject_code' AND 'teacher_name' are identical. If the same subject code is taught by different teachers, extract both entries.
2. Exclude non-academic activities: "กิจกรรม", "ที่ปรึกษา", "หน้าเสาธง", "โฮมรูม", "คุณธรรม", "ชุมนุม", "แนะแนว", "ลูกเสือ", "รด.", "จิตอาสา", or lunch breaks.
3. Clean course codes: remove classroom/building numbers (e.g. 545, BL, ML, CL).
4. Clean teacher names: retain "ครู" or "Teacher" prefix.
5. Output strictly a JSON array of objects:
[
  {
    "subject_code": "ค32101",
    "subject_name": "คณิตศาสตร์พื้นฐาน",
    "teacher_name": "ครูศิวาพร"
  }
]`;

      let parsedItems = null;
      let lastError = null;

      for (const model of MODELS) {
        try {
          const statusText = document.getElementById('ocr-status-text');
          if (statusText) statusText.textContent = `กำลังสแกนผ่าน AI (${model})...`;

          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [
                { text: prompt },
                { inline_data: { mime_type: 'image/jpeg', data: base64 } }
              ]}],
              generationConfig: {
                response_mime_type: "application/json",
                temperature: 0.1
              }
            })
          });

          const json = await resp.json();
          if (json.error) throw new Error(json.error.message || `Error with ${model}`);

          const text = json.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
          const items = JSON.parse(text);

          if (Array.isArray(items) && items.length > 0) {
            parsedItems = items;
            break;
          }
        } catch (err) {
          console.warn(`Model ${model} failed, trying fallback:`, err);
          lastError = err;
          await new Promise(r => setTimeout(r, 1000));
        }
      }

      if (!parsedItems) {
        throw lastError || new Error('ไม่สามารถประมวลผลตารางเรียนได้ กรุณาลองใช้รูปที่ชัดเจนขึ้น');
      }

      // ระบบตัดวิชาซ้ำรอบที่สอง (รหัสวิชา + ครู)
      const seen = new Set();
      const uniqueItems = [];
      for (const item of parsedItems) {
        const code = (item.subject_code || '').trim();
        const teacher = (item.teacher_name || '').trim();
        const key = `${code.toLowerCase()}__${teacher.toLowerCase()}`;
        if (code && !seen.has(key)) {
          seen.add(key);
          uniqueItems.push({
            subject_code: code,
            subject_name: (item.subject_name || '').trim(),
            teacher_name: teacher
          });
        }
      }

      if (!uniqueItems.length) throw new Error('ไม่พบรายวิชาที่อ่านได้ในรูปภาพนี้');
      renderOcrPreview(uniqueItems);
    } catch (err) {
      console.error(err);
      resultEl.innerHTML = `<div class="text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 rounded-xl p-3">${esc(err.message || 'เกิดข้อผิดพลาดในการสแกน')}</div>`;
    }
  };
}

function renderOcrPreview(items) {
  const resultEl = document.getElementById('ocr-result');
  resultEl.innerHTML = `
    <div class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-2 flex items-center justify-between">
      <span>พบ ${items.length} วิชาที่ไม่ซ้ำกัน</span>
      <span class="text-[11px] text-brand-600 dark:text-brand-400">ตรวจสอบก่อนบันทึก</span>
    </div>
    <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
      ${items.map((it, i) => `
        <div class="flex gap-1.5 items-center bg-slate-50 dark:bg-slate-800/50 p-1.5 rounded-xl border border-slate-100 dark:border-slate-800" data-ocr-row="${i}">
          <input data-ocr-code="${i}" value="${esc(it.subject_code)}" placeholder="รหัสวิชา" class="w-24 shrink-0 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-bold text-slate-800 dark:text-slate-100 outline-none">
          <input data-ocr-name="${i}" value="${esc(it.subject_name)}" placeholder="ชื่อวิชา" class="flex-1 min-w-0 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs text-slate-800 dark:text-slate-100 outline-none">
          <input data-ocr-teacher="${i}" value="${esc(it.teacher_name)}" placeholder="ครูผู้สอน" class="flex-1 min-w-0 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs text-slate-800 dark:text-slate-100 outline-none">
          <button data-ocr-remove="${i}" class="w-7 h-7 shrink-0 rounded-lg bg-red-50 dark:bg-red-500/10 grid place-items-center text-red-500 dark:text-red-400">${icon('x','w-3.5 h-3.5')}</button>
        </div>`).join('')}
    </div>
    <button id="ocr-save-all" class="w-full mt-4 py-3 rounded-xl bg-brand-600 text-white font-bold text-sm flex items-center justify-center gap-2">
      ${icon('check','w-4 h-4')} บันทึก ${items.length} วิชาลงห้องเรียน
    </button>
  `;
  renderIcons();

  document.querySelectorAll('[data-ocr-remove]').forEach(b => {
    b.onclick = () => {
      const row = document.querySelector(`[data-ocr-row="${b.dataset.ocrRemove}"]`);
      if (row) row.remove();
      const remaining = document.querySelectorAll('[data-ocr-row]').length;
      const saveBtn = document.getElementById('ocr-save-all');
      if (saveBtn) saveBtn.innerHTML = `${icon('check','w-4 h-4')} บันทึก ${remaining} วิชาลงห้องเรียน`;
      renderIcons();
    };
  });

  const saveBtn = document.getElementById('ocr-save-all');
  saveBtn.onclick = async () => {
    const rows = [...document.querySelectorAll('[data-ocr-row]')];
    const payload = rows.map(r => {
      const i = r.dataset.ocrRow;
      return {
        classroom_id: state.classroom.id,
        subject_code: document.querySelector(`[data-ocr-code="${i}"]`).value.trim(),
        subject_name: document.querySelector(`[data-ocr-name="${i}"]`).value.trim(),
        teacher_name: document.querySelector(`[data-ocr-teacher="${i}"]`).value.trim(),
      };
    }).filter(p => p.subject_code);

    if (!payload.length) { toast('ไม่มีข้อมูลให้บันทึก', 'error'); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = 'กำลังบันทึกลงฐานข้อมูล...';

    try {
      const sb = await ensureSupabase();
      if (!sb) return;
      const { error } = await sb.from('subjects').insert(payload);
      if (error) throw error;
      toast(`บันทึก ${payload.length} รายวิชาเรียบร้อยแล้ว`, 'success');
      await loadClassroomData();
      renderSubjectManager();
    } catch (e) {
      console.error(e);
      toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
      saveBtn.disabled = false;
      saveBtn.textContent = 'บันทึกทั้งหมดลงห้องเรียน';
    }
  };
}

function imageFieldPreview(url, id) {
  return `<div id="${id}" class="mt-2">${url ? `<img src="${esc(url)}" class="w-16 h-16 object-cover rounded-xl border border-slate-200 dark:border-slate-700">` : ''}</div>`;
}

// Renders the current document-attachment pill inside the assignment form,
// with a remove (x) button when a file is already attached and none is pending.
function docAttachmentPill(fileName, fileSizeLabel, fileUrl) {
  if (!fileUrl) return '';
  const meta = fileTypeMeta(fileName);
  return `
  <div class="flex items-center gap-1.5 pl-2.5 pr-1.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300 max-w-full w-fit">
    ${icon(meta.icon,'w-3.5 h-3.5 shrink-0')}
    <span class="truncate max-w-[10rem]">${esc(fileName || 'ไฟล์แนบ')}</span>
    ${fileSizeLabel ? `<span class="text-slate-400 dark:text-slate-500 shrink-0">· ${esc(fileSizeLabel)}</span>` : ''}
    <button type="button" id="remove-doc-attachment" class="ml-1 w-5 h-5 rounded-md grid place-items-center text-slate-400 hover:text-red-500 dark:hover:text-red-400 shrink-0">${icon('x','w-3 h-3')}</button>
  </div>`;
}

function renderSubjectForm() {
  const s = state.editingSubject || { subject_code:'', subject_name:'', teacher_name:'', teacher_image_url:'', subject_icon_url:'' };
  document.getElementById('modal-root').innerHTML = modalShell(`
    <div class="p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-extrabold text-lg text-slate-900 dark:text-white">${state.editingSubject ? 'แก้ไขรายวิชา' : 'เพิ่มรายวิชา'}</h3>
        <button id="modal-close" class="${closeBtnCls}">${icon('x','w-4 h-4')}</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="${labelCls}">รหัสวิชา</label>
          <input id="f-code" value="${esc(s.subject_code)}" placeholder="ค32101" class="${inputCls}">
        </div>
        <div>
          <label class="${labelCls}">ชื่อวิชา</label>
          <input id="f-name" value="${esc(s.subject_name)}" placeholder="คณิตศาสตร์พื้นฐาน" class="${inputCls}">
        </div>
        <div>
          <label class="${labelCls}">ครูผู้สอน</label>
          <input id="f-teacher" value="${esc(s.teacher_name)}" placeholder="ครูศิวาพร" class="${inputCls}">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="${labelCls}">รูปครูผู้สอน (ไม่บังคับ)</label>
            <input id="f-teacher-image" type="file" accept="image/*" class="w-full text-xs text-slate-500 dark:text-slate-400">
            ${imageFieldPreview(s.teacher_image_url, 'teacher-image-preview')}
          </div>
          <div>
            <label class="${labelCls}">ไอคอนวิชา (ไม่บังคับ)</label>
            <input id="f-subject-icon" type="file" accept="image/*" class="w-full text-xs text-slate-500 dark:text-slate-400">
            ${imageFieldPreview(s.subject_icon_url, 'subject-icon-preview')}
          </div>
        </div>
      </div>
      <button id="save-subject" class="w-full mt-5 py-3 rounded-xl bg-brand-600 text-white font-bold text-sm flex items-center justify-center gap-2">
        <span id="save-subject-label">บันทึกรายวิชา</span>
      </button>
    </div>
  `);
  renderIcons();
  document.getElementById('modal-close').onclick = () => renderSubjectManager();
  document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id==='modal-backdrop') renderSubjectManager(); });

  document.getElementById('f-teacher-image').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    document.getElementById('teacher-image-preview').innerHTML = `<img src="${URL.createObjectURL(f)}" class="w-16 h-16 object-cover rounded-xl border border-slate-200 dark:border-slate-700">`;
  };
  document.getElementById('f-subject-icon').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    document.getElementById('subject-icon-preview').innerHTML = `<img src="${URL.createObjectURL(f)}" class="w-16 h-16 object-cover rounded-xl border border-slate-200 dark:border-slate-700">`;
  };

  const saveSubjectBtn = document.getElementById('save-subject');
  const saveSubjectLabel = document.getElementById('save-subject-label');
  saveSubjectBtn.onclick = async () => {
    const code = document.getElementById('f-code').value.trim();
    const name = document.getElementById('f-name').value.trim();
    const teacher = document.getElementById('f-teacher').value.trim();
    if (!code) { toast('กรุณากรอกรหัสวิชา', 'error'); return; }
    saveSubjectBtn.disabled = true; saveSubjectLabel.textContent = 'กำลังบันทึก...';
    try {
      const sb = await ensureSupabase();
      if (!sb) return;

      let teacher_image_url = s.teacher_image_url || null;
      const teacherFile = document.getElementById('f-teacher-image').files[0];
      if (teacherFile) {
        saveSubjectLabel.textContent = 'กำลังอัปโหลดรูป...';
        teacher_image_url = await uploadImage(teacherFile, 'teachers', { maxDim: 500, quality: 0.8, maxBytes: 150*1024 });
      }
      let subject_icon_url = s.subject_icon_url || null;
      const iconFile = document.getElementById('f-subject-icon').files[0];
      if (iconFile) {
        saveSubjectLabel.textContent = 'กำลังอัปโหลดไอคอน...';
        subject_icon_url = await uploadImage(iconFile, 'subjects', { maxDim: 400, quality: 0.8, maxBytes: 120*1024 });
      }

      saveSubjectLabel.textContent = 'กำลังบันทึก...';
      const payload = { subject_code: code, subject_name: name, teacher_name: teacher, teacher_image_url, subject_icon_url };
      let error;
      if (state.editingSubject) {
        ({ error } = await sb.from('subjects').update(payload).eq('id', state.editingSubject.id));
      } else {
        ({ error } = await sb.from('subjects').insert({ classroom_id: state.classroom.id, ...payload }));
      }
      if (error) { toast('บันทึกไม่สำเร็จ', 'error'); console.error(error); return; }
      toast('บันทึกรายวิชาแล้ว', 'success');
      await loadClassroomData();
      renderSubjectManager();
    } catch (e) {
      console.error(e);
      toast(e.message === 'no supabase client' ? 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง' : 'อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
    } finally {
      if (saveSubjectBtn.isConnected) { saveSubjectBtn.disabled = false; saveSubjectLabel.textContent = 'บันทึกรายวิชา'; }
    }
  };
}

    const f = e.target.files[0];
    if (!f) return;
    document.getElementById('assignment-image-preview').innerHTML = `<img src="${URL.createObjectURL(f)}" class="w-16 h-16 object-cover rounded-xl border border-slate-200 dark:border-slate-700">`;
  };

  let removeDocAttachment = false;
  function wireDocRemoveBtn() {
    const removeBtn = document.getElementById('remove-doc-attachment');
    if (removeBtn) removeBtn.onclick = () => {
      removeDocAttachment = true;
      document.getElementById('f-doc').value = '';
      document.getElementById('doc-attachment-preview').innerHTML = '';
    };
  }
  wireDocRemoveBtn();

  document.getElementById('f-doc').onchange = (e) => {
    const f = e.target.files[0];
    const previewEl = document.getElementById('doc-attachment-preview');
    if (!f) return;
    if (f.size > 15 * 1024 * 1024) {
      toast('ไฟล์แนบมีขนาดเกิน 15 MB', 'error');
      e.target.value = '';
      return;
    }
    removeDocAttachment = false;
    const meta = fileTypeMeta(f.name);
    previewEl.innerHTML = `
      <div class="flex items-center gap-1.5 pl-2.5 pr-1.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300 max-w-full w-fit">
        ${icon(meta.icon,'w-3.5 h-3.5 shrink-0')}
        <span class="truncate max-w-[10rem]">${esc(f.name)}</span>
        <span class="text-slate-400 dark:text-slate-500 shrink-0">· ${formatFileSize(f.size)}</span>
      </div>`;
    renderIcons();
  };

  const btn = document.getElementById('save-assignment');
  const label = document.getElementById('save-assignment-label');
  btn.onclick = async () => {
    const title = document.getElementById('f-title').value.trim();
    const due = document.getElementById('f-due').value;
    if (!title) { toast('กรุณากรอกชื่องาน', 'error'); return; }
    if (!due) { toast('กรุณาเลือกกำหนดส่ง', 'error'); return; }

    btn.disabled = true; label.textContent = 'กำลังบันทึก...';

    try {
      const sb = await ensureSupabase();
      if (!sb) return;

      let image_url = a.image_url || null;
      const fileInput = document.getElementById('f-image');
      if (fileInput.files[0]) {
        label.textContent = 'กำลังอัปโหลดรูป...';
        try {
          image_url = await uploadImage(fileInput.files[0], 'assignments', { maxDim: 1200, quality: 0.75, maxBytes: 250*1024 });
        } catch (err) {
          console.error(err);
          toast('อัปโหลดรูปไม่สำเร็จ', 'error');
          return;
        }
        label.textContent = 'กำลังบันทึก...';
      }

      let file_url = a.file_url || null;
      let file_name = a.file_name || null;
      let file_size_label = a.file_size_label || null;
      const docInput = document.getElementById('f-doc');
      if (docInput.files[0]) {
        const df = docInput.files[0];
        if (df.size > 15 * 1024 * 1024) { toast('ไฟล์แนบมีขนาดเกิน 15 MB', 'error'); return; }
        label.textContent = 'กำลังอัปโหลดไฟล์แนบ...';
        try {
          const res = await uploadFileToGoogleDrive(df, { isImage: false, category: 'เอกสารดาวน์โหลด', roomFolder: getRoomFolder() });
          file_url = res.downloadUrl || res.url;
          file_name = res.fileName || df.name;
          file_size_label = formatFileSize(df.size);
        } catch (err) {
          console.error(err);
          toast(err.message || 'อัปโหลดไฟล์แนบไม่สำเร็จ', 'error');
          return;
        }
        label.textContent = 'กำลังบันทึก...';
      } else if (removeDocAttachment) {
        file_url = null; file_name = null; file_size_label = null;
      }

      const payload = {
        classroom_id: state.classroom.id,
        subject_id: document.getElementById('f-subject').value || null,
        title,
        description: document.getElementById('f-desc').value.trim(),
        task_type: document.getElementById('f-type').value,
        due_date: new Date(due).toISOString(),
        created_by: document.getElementById('f-creator').value.trim(),
        image_url,
        file_url,
        file_name,
        file_size_label,
      };

      let error;
      if (state.editingAssignment) {
        ({ error } = await sb.from('assignments').update(payload).eq('id', state.editingAssignment.id));
      } else {
        ({ error } = await sb.from('assignments').insert(payload));
      }
      if (error) { toast('บันทึกไม่สำเร็จ', 'error'); console.error(error); return; }
      toast('บันทึกการบ้านแล้ว', 'success');
      closeModal();
      await loadClassroomData();
    } catch (e) {
      console.error(e);
      toast('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
    } finally {
      if (btn.isConnected) { btn.disabled = false; label.textContent = 'บันทึกการบ้าน'; }
    }
  };
}

function renderImagePreviewModal(url) {
  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 z-[300] bg-black/85 flex items-center justify-center p-4" id="img-backdrop">
      <button id="img-close" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/10 text-white grid place-items-center">${icon('x','w-5 h-5')}</button>
      <img src="${esc(url)}" class="max-w-full max-h-full rounded-xl object-contain rise-in">
    </div>`;
  renderIcons();
  document.getElementById('img-close').onclick = closeModal;
  document.getElementById('img-backdrop').addEventListener('click', e => { if (e.target.id==='img-backdrop') closeModal(); });
}

function promptNewClassroomPasscode(g, r) {
  document.getElementById('modal-root').innerHTML = modalShell(`
    <div class="p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-extrabold text-lg text-slate-900 dark:text-white">ยังไม่มีห้องนี้ในระบบ</h3>
        <button id="modal-close" class="${closeBtnCls}">${icon('x','w-4 h-4')}</button>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">ตั้งรหัสผ่านสำหรับตัวแทนห้อง ${GRADE_TH[g]}/${r} เพื่อสร้างห้องนี้ขึ้นมาใหม่ (ใช้สำหรับจัดการวิชาและการบ้านในภายหลัง)</p>
      <input id="new-passcode" type="text" inputmode="numeric" maxlength="10" placeholder="ตั้งรหัสผ่าน 4-10 ตัวอักษร" class="${inputCls} text-center tracking-widest font-bold num text-lg py-3">
      <button id="create-classroom" class="w-full mt-4 py-3 rounded-xl bg-brand-600 text-white font-bold text-sm">สร้างห้องเรียน</button>
    </div>
  `);
  renderIcons();
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id==='modal-backdrop') closeModal(); });
  const createBtn = document.getElementById('create-classroom');
  createBtn.onclick = async () => {
    const code = document.getElementById('new-passcode').value.trim();
    if (code.length < 4) { toast('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร', 'error'); return; }
    const originalLabel = createBtn.textContent;
    createBtn.disabled = true; createBtn.textContent = 'กำลังสร้างห้อง...';
    try {
      const sb = await ensureSupabase();
      if (!sb) return;
      const { data, error } = await sb.rpc('get_or_create_classroom', { p_grade: g, p_room: r, p_passcode: code });
      if (error) { toast('สร้างห้องไม่สำเร็จ', 'error'); console.error(error); return; }
      const row = Array.isArray(data) ? data[0] : data;
      state.classroom = { id: row.id, grade_level: g, room_number: r };
      localStorage.setItem(LS.classroom, JSON.stringify(state.classroom));
      // The creator already knows the passcode they just set — unlock rep mode immediately.
      setRepUnlocked(row.id);
      state.repMode = true;
      closeModal();
      toast('สร้างห้องเรียนแล้ว จำรหัสผ่านนี้ไว้นะ', 'success');
      state.view = 'dashboard';
      await loadClassroomData();
    } catch (e) {
      console.error(e);
      toast('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
    } finally {
      if (createBtn.isConnected) { createBtn.disabled = false; createBtn.textContent = originalLabel; }
    }
  };
}

// ---------- RENDER / ROUTER ----------------------------------------------------
function render() {
  const app = document.getElementById('app');
  if (state.view === 'picker') app.innerHTML = ViewPicker();
  else if (state.view === 'dashboard' && state.classroom) app.innerHTML = ViewDashboard();
  else app.innerHTML = '';
  renderIcons();
  wireEvents();
}

function wireEvents() {
  const themeBtn = document.getElementById('theme-toggle');
  if (themeBtn) themeBtn.onclick = toggleTheme;

  if (state.view === 'picker') {
    let g = null, r = null;
    document.querySelectorAll('.grade-btn').forEach(b => b.onclick = () => {
      g = Number(b.dataset.grade);
      document.querySelectorAll('.grade-btn').forEach(x => x.dataset.active = (x===b));
      checkReady();
    });
    document.querySelectorAll('.room-btn').forEach(b => b.onclick = () => {
      r = Number(b.dataset.room);
      document.querySelectorAll('.room-btn').forEach(x => x.dataset.active = (x===b));
      checkReady();
    });
    function checkReady() {
      document.getElementById('confirm-picker').disabled = !(g && r);
    }
    document.getElementById('confirm-picker').onclick = async () => {
      if (!g || !r) return;
      const btn = document.getElementById('confirm-picker');
      const originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
      try {
        const sb = await ensureSupabase();
        if (!sb) return;
        const { data: existing, error } = await sb.from('classrooms_public').select('*').eq('grade_level', g).eq('room_number', r).maybeSingle();
        if (error) { toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง', 'error'); console.error(error); return; }
        if (existing) {
          state.classroom = { id: existing.id, grade_level: g, room_number: r };
          localStorage.setItem(LS.classroom, JSON.stringify(state.classroom));
          state.repMode = isRepUnlocked(existing.id);
          state.view = 'dashboard';
          await loadClassroomData();
        } else {
          promptNewClassroomPasscode(g, r);
        }
      } catch (e) {
        console.error(e);
        toast('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
      } finally {
        if (btn.isConnected) { btn.disabled = false; btn.textContent = originalLabel; }
      }
    };
  }

  if (state.view === 'dashboard') {
    if (state.repMode && !isRepUnlocked(state.classroom.id)) state.repMode = false;

    document.getElementById('switch-room').onclick = async () => {
      const ok = await confirmDialog({ title:'เปลี่ยนห้องเรียน', message:'ต้องการออกจากห้องนี้และเลือกห้องใหม่หรือไม่?', confirmLabel:'เปลี่ยนห้อง' });
      if (!ok) return;
      localStorage.removeItem(LS.classroom);
      state.classroom = null; state.repMode = false;
      state.view = 'picker'; render();
    };
    document.getElementById('rep-mode-btn').onclick = () => {
      if (state.repMode) { state.repMode = false; render(); return; }
      if (isRepUnlocked(state.classroom.id)) { state.repMode = true; render(); return; }
      renderRepGate();
    };
    document.getElementById('search-input').oninput = (e) => { state.search = e.target.value; render(); document.getElementById('search-input')?.focus(); };
    document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { state.filter = b.dataset.tab; render(); });
    document.querySelectorAll('.subj-filter-btn').forEach(b => b.onclick = () => { state.subjectFilter = b.dataset.subj; render(); });

    document.querySelectorAll('[data-toggle-done]').forEach(b => b.onclick = () => {
      const id = b.dataset.toggleDone;
      if (state.doneIds.has(id)) state.doneIds.delete(id); else state.doneIds.add(id);
      saveDone();
      render();
    });
    document.querySelectorAll('[data-preview]').forEach(b => b.onclick = () => renderImagePreviewModal(b.dataset.preview));

    const addBtn = document.getElementById('add-assignment-btn');
    if (addBtn) addBtn.onclick = () => { state.editingAssignment = null; renderAssignmentForm(); };
    const mgBtn = document.getElementById('manage-subjects-btn');
    if (mgBtn) mgBtn.onclick = renderSubjectManager;

    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      state.editingAssignment = state.assignments.find(a => a.id === b.dataset.edit);
      renderAssignmentForm();
    });
    document.querySelectorAll('[data-delete]').forEach(b => b.onclick = async () => {
      const ok = await confirmDialog({ title:'ลบการบ้าน', message:'ต้องการลบการบ้านนี้ออกจากห้องหรือไม่? ไม่สามารถกู้คืนได้', confirmLabel:'ลบการบ้าน', danger:true });
      if (!ok) return;
      b.disabled = true;
      try {
        const sb = await ensureSupabase();
        if (!sb) return;
        const { error } = await sb.from('assignments').delete().eq('id', b.dataset.delete);
        if (error) { toast('ลบไม่สำเร็จ', 'error'); console.error(error); return; }
        toast('ลบการบ้านแล้ว', 'success');
        await loadClassroomData();
      } catch (e) {
        console.error(e);
        toast('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
      } finally {
        if (b.isConnected) b.disabled = false;
      }
    });
  }
}

// ---------- BOOT ----------------------------------------------------------
function boot() {
  try {
    loadLocal();
    initSupabase();
    if (!state.supabase) {
      // CDN script may not have finished loading yet on slower networks —
      // give it one short retry before surfacing an error toast.
      setTimeout(() => {
        initSupabase();
        if (!state.supabase) {
          toast('เชื่อมต่อ Supabase ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้', 'error');
        }
        continueBoot();
      }, 400);
      return;
    }
    continueBoot();
  } catch (e) {
    console.error('Boot failed:', e);
    state.view = 'picker';
    render();
  }
}

function continueBoot() {
  if (state.classroom) {
    state.repMode = isRepUnlocked(state.classroom.id);
    state.view = 'dashboard';
    loadClassroomData();
  } else {
    state.view = 'picker';
    render();
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
